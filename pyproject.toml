[project]
name = "fuse_construction"
authors = [{ name = "Syncflo", email = "ops@syncflo.co.za" }]
description = "Construction for Fuse — BOQ, tenders, subcontracts, retention, site labour and project shape, with Sage Intacct as the ledger."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# ERPNext is required: Project, Task, Timesheet, Purchase Order and Employee are all its own.
# fuse_core is required for the module switches, the tiles and the Intacct gateway.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "fuse_construction"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Frappe apps indent with tabs; E101/W191 fight that convention, not real defects.
ignore = ["E101", "E501", "W191"]

[tool.ruff.lint.isort]
known-third-party = ["frappe", "erpnext", "fuse_core"]

[tool.ruff.format]
indent-style = "tab"
